services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poultry
      POSTGRES_PASSWORD: poultry
      POSTGRES_DB: poultry_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poultry -d poultry_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
